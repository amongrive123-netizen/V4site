<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Jour 12 ♡ — Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=SF+Pro+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--imessage-blue:#007AFF;--imessage-gray:#E5E5EA;--bg:#fff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#ffdbe9,#fff7fb);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;}

/* ===== PHONE FRAME ===== */
.phone-wrap{display:flex;justify-content:center;align-items:center;width:100%;height:100%;padding:10px;}
.phone{position:relative;width:100%;max-width:400px;height:100%;max-height:850px;background:#000;border-radius:48px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.25),0 0 0 3px rgba(255,255,255,0.1) inset;display:flex;flex-direction:column;}

/* Dynamic Island */
.dynamic-island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:35px;background:#000;border-radius:20px;z-index:100;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.3s cubic-bezier(0.2,0.8,0.2,1);}
.dynamic-island.active{width:200px;height:50px;border-radius:25px;}
.island-cam{width:10px;height:10px;background:#1a1a1a;border-radius:50%;box-shadow:inset 0 0 3px rgba(255,255,255,0.1);}
.island-light{width:6px;height:6px;background:#2a2a2a;border-radius:50%;}

/* Status Bar */
.status-bar{position:absolute;top:0;left:0;right:0;height:54px;padding:12px 28px 0;display:flex;justify-content:space-between;align-items:center;z-index:90;color:#fff;font-size:14px;font-weight:600;pointer-events:none;}
.status-time{font-variant-numeric:tabular-nums;}
.status-icons{display:flex;gap:5px;align-items:center;}
.status-icon{width:18px;height:12px;}

/* ===== HEADER ===== */
.msg-header{background:rgba(248,248,248,0.85);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);padding:60px 16px 12px;display:flex;flex-direction:column;align-items:center;border-bottom:1px solid rgba(0,0,0,0.05);position:relative;z-index:50;}
.back-btn{position:absolute;left:12px;top:58px;color:var(--imessage-blue);font-size:28px;line-height:1;cursor:pointer;padding:4px 8px;}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ff6b9d,#ff4f95);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(255,79,149,0.3);}
.contact-name{font-size:16px;font-weight:600;color:#000;margin-top:6px;}
.contact-status{font-size:11px;color:#8E8E93;margin-top:2px;}

/* ===== CHAT ===== */
.chat{flex:1;overflow-y:auto;padding:16px;background:#fff;scroll-behavior:smooth;-ms-overflow-style:none;scrollbar-width:none;}
.chat::-webkit-scrollbar{display:none;}

/* Date separator */
.date-sep{text-align:center;margin:16px 0;font-size:11px;color:#8E8E93;font-weight:500;}

/* Messages */
.msg-wrap{display:flex;margin-bottom:4px;animation:none;}
.msg-wrap.in{justify-content:flex-start;}
.msg-wrap.out{justify-content:flex-end;}

.msg{max-width:75%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.35;position:relative;word-wrap:break-word;transform:scale(0.8) translateY(10px);opacity:0;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);}
.msg.show{transform:scale(1) translateY(0);opacity:1;}

.msg.in{background:var(--imessage-gray);color:#000;border-bottom-left-radius:6px;margin-left:8px;}
.msg.out{background:var(--imessage-blue);color:#fff;border-bottom-right-radius:6px;margin-right:8px;}

/* Tail */
.msg.in::before{content:'';position:absolute;bottom:0;left:-6px;width:12px;height:20px;background:var(--imessage-gray);border-bottom-right-radius:100%;clip-path:polygon(0 0,100% 100%,100% 0);}
.msg.out::before{content:'';position:absolute;bottom:0;right:-6px;width:12px;height:20px;background:var(--imessage-blue);border-bottom-left-radius:100%;clip-path:polygon(0 0,0 100%,100% 0);}

/* Emoji reactions */
.reaction{position:absolute;bottom:-10px;right:-6px;background:#fff;border-radius:12px;padding:2px 6px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.12);border:1px solid rgba(0,0,0,0.05);transform:scale(0);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.reaction.show{transform:scale(1);}

/* Read receipt */
.read-status{text-align:right;font-size:11px;color:#8E8E93;margin-right:12px;margin-bottom:12px;opacity:0;transition:opacity 0.4s;}
.read-status.show{opacity:1;}

/* Typing indicator */
.typing-wrap{display:none;align-items:flex-end;margin-bottom:8px;animation:fadeIn 0.3s;}
.typing-bubble{background:var(--imessage-gray);border-radius:20px;border-bottom-left-radius:6px;padding:14px 16px;display:flex;gap:4px;align-items:center;width:70px;height:36px;}
.typing-dot{width:7px;height:7px;background:#999;border-radius:50%;animation:typingBounce 1.4s infinite;}
.typing-dot:nth-child(2){animation-delay:0.2s;}
.typing-dot:nth-child(3){animation-delay:0.4s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}

/* ===== INPUT AREA ===== */
.input-area{padding:10px 12px 24px;background:#f8f8f8;border-top:1px solid rgba(0,0,0,0.05);display:flex;align-items:center;gap:8px;z-index:50;}
.input-btn{width:32px;height:32px;border-radius:50%;background:#e5e5ea;display:flex;align-items:center;justify-content:center;color:var(--imessage-blue);font-size:20px;cursor:pointer;transition:transform 0.15s;}
.input-btn:active{transform:scale(0.9);}
.input-field{flex:1;height:36px;background:#fff;border-radius:18px;border:1px solid rgba(0,0,0,0.08);display:flex;align-items:center;padding:0 14px;color:#8E8E93;font-size:15px;}
.send-btn{width:32px;height:32px;border-radius:50%;background:var(--imessage-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:transform 0.15s,opacity 0.2s;opacity:0.5;}
.send-btn.active{opacity:1;}
.send-btn:active{transform:scale(0.9);}

/* ===== START OVERLAY ===== */
#startOverlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s;}
#startOverlay.hidden{opacity:0;pointer-events:none;}
.start-card{background:#fff;border-radius:24px;padding:28px;text-align:center;max-width:280px;box-shadow:0 20px 60px rgba(0,0,0,0.2);animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes popIn{from{transform:scale(0.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.start-icon{font-size:48px;margin-bottom:12px;}
.start-title{font-size:18px;font-weight:700;margin-bottom:8px;}
.start-text{font-size:14px;color:#666;line-height:1.5;margin-bottom:20px;}
.start-btn{background:var(--imessage-blue);color:#fff;border:none;padding:14px 28px;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;width:100%;transition:transform 0.15s;}
.start-btn:active{transform:scale(0.96);}

/* ===== BACK BUTTON FINAL ===== */
.back-final{display:none;margin-top:12px;padding:12px 20px;background:var(--imessage-blue);color:#fff;border-radius:14px;text-decoration:none;font-weight:600;font-size:14px;text-align:center;transition:transform 0.15s;}
.back-final:active{transform:scale(0.96);}

/* Animations */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* Reduced motion */
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
<base target="_blank">
</head>
<body>

<div class="phone-wrap">
  <div class="phone">
    <!-- Dynamic Island -->
    <div class="dynamic-island" id="island">
      <div class="island-cam"></div>
      <div class="island-light"></div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-time" id="clock">19:42</div>
      <div class="status-icons">
        <svg class="status-icon" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        <svg class="status-icon" viewBox="0 0 24 24" fill="white"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </div>
    </div>

    <!-- Header -->
    <div class="msg-header">
      <div class="back-btn">‹</div>
      <div class="avatar">❤️</div>
      <div class="contact-name">Haroun ❤️</div>
      <div class="contact-status" id="contactStatus">iMessage</div>
    </div>

    <!-- Chat -->
    <div class="chat" id="chat">
      <div class="date-sep" id="dateSep">Aujourd'hui 19:42</div>

      <div class="typing-wrap" id="typing">
        <div class="typing-bubble">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-btn">📷</div>
      <div class="input-field">iMessage</div>
      <div class="input-btn">🎙️</div>
      <div class="send-btn" id="sendBtn">↑</div>
    </div>

    <!-- Start Overlay -->
    <div id="startOverlay">
      <div class="start-card">
        <div class="start-icon">💬</div>
        <div class="start-title">Nouveau message</div>
        <div class="start-text">Haroun t'a envoyé une conversation spéciale... Ouvre-la pour découvrir.</div>
        <button class="start-btn" id="startBtn">Ouvrir ❤️</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================
   AUDIO ENGINE — Sons iPhone
   ============================ */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio(){ if(!audioCtx) audioCtx = new AudioCtx(); }

// Son de réception iMessage (ding aigu)
function playReceive(){
  initAudio();
  const t = audioCtx.currentTime;
  // Note principale
  const o1 = audioCtx.createOscillator();
  const g1 = audioCtx.createGain();
  o1.connect(g1); g1.connect(audioCtx.destination);
  o1.type = 'sine';
  o1.frequency.setValueAtTime(1050, t);
  o1.frequency.exponentialRampToValueAtTime(880, t + 0.08);
  g1.gain.setValueAtTime(0, t);
  g1.gain.linearRampToValueAtTime(0.12, t + 0.01);
  g1.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o1.start(t); o1.stop(t + 0.2);
  // Harmonic
  const o2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  o2.connect(g2); g2.connect(audioCtx.destination);
  o2.type = 'sine';
  o2.frequency.setValueAtTime(2100, t);
  g2.gain.setValueAtTime(0, t);
  g2.gain.linearRampToValueAtTime(0.04, t + 0.01);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o2.start(t); o2.stop(t + 0.15);
  // Vibration
  if(navigator.vibrate) navigator.vibrate(12);
}

// Son d'envoi (swoosh)
function playSend(){
  initAudio();
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(600, t);
  o.frequency.exponentialRampToValueAtTime(1200, t + 0.08);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.06, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.start(t); o.stop(t + 0.15);
}

// Son typing (micro-clic)
function playTyping(){
  initAudio();
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(800, t);
  g.gain.setValueAtTime(0.015, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
  o.start(t); o.stop(t + 0.04);
}

// Son ouverture conversation
function playOpen(){
  initAudio();
  const t = audioCtx.currentTime;
  [523, 659, 784].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0, t + i*0.06);
    g.gain.linearRampToValueAtTime(0.06, t + i*0.06 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + i*0.06 + 0.2);
    o.start(t + i*0.06); o.stop(t + i*0.06 + 0.25);
  });
}

// Son final
function playFinal(){
  initAudio();
  const t = audioCtx.currentTime;
  [784, 880, 988, 1047, 1175].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0, t + i*0.1);
    g.gain.linearRampToValueAtTime(0.07, t + i*0.1 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + i*0.1 + 0.4);
    o.start(t + i*0.1); o.stop(t + i*0.1 + 0.5);
  });
}

/* ============================
   MESSAGES DATA
   ============================ */
const messages = [
  { text: "Coucou mon amour ❤️", reaction: null },
  { text: "J'espère que tu passes une bonne journée.", reaction: null },
  { text: "Je pensais à toi... alors je me suis dit que j'allais t'écrire. 🥹", reaction: "❤️" },
  { text: "Tu me manques énormément.", reaction: null },
  { text: "J'ai tellement hâte de te retrouver.", reaction: null },
  { text: "Tu sais...", reaction: null },
  { text: "Parfois je souris tout seul en repensant à nous.", reaction: "🥹" },
  { text: "Tu rends vraiment ma vie plus belle.", reaction: null },
  { text: "Merci d'être là. ❤️", reaction: "❤️" },
  { text: "Prends bien soin de toi pendant tes vacances.", reaction: null },
  { text: "Promets-moi juste une chose...", reaction: null },
  { text: "Continue de sourire.", reaction: null },
  { text: "Parce que ton sourire est l'une de mes choses préférées. ❤️", reaction: "💖" },
  { text: "Je t'aime énormément, mon amour. ❤️", reaction: null }
];

/* ============================
   DOM
   ============================ */
const chat = document.getElementById('chat');
const typing = document.getElementById('typing');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const contactStatus = document.getElementById('contactStatus');
const clock = document.getElementById('clock');
const island = document.getElementById('island');
const sendBtn = document.getElementById('sendBtn');

// Clock
function updateClock(){
  const now = new Date();
  clock.textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}
updateClock();
setInterval(updateClock, 30000);

/* ============================
   START
   ============================ */
startBtn.onclick = async () => {
  initAudio();
  playOpen();
  startOverlay.classList.add('hidden');
  if(navigator.vibrate) navigator.vibrate(15);
  await wait(500);
  playConversation();
};

/* ============================
   CONVERSATION PLAYER
   ============================ */
async function playConversation(){
  for(let i = 0; i < messages.length; i++){
    const msg = messages[i];

    // Show typing
    typing.style.display = 'flex';
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;
    contactStatus.textContent = 'écrit...';

    // Typing sound every ~600ms
    let typingInterval = setInterval(() => playTyping(), 600);

    await wait(1800 + Math.random() * 600);
    clearInterval(typingInterval);

    // Hide typing
    typing.style.display = 'none';
    contactStatus.textContent = 'iMessage';

    // Add message
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap in';
    const bubble = document.createElement('div');
    bubble.className = 'msg in';
    bubble.textContent = msg.text;
    wrap.appendChild(bubble);

    // Reaction
    if(msg.reaction){
      const react = document.createElement('div');
      react.className = 'reaction';
      react.textContent = msg.reaction;
      bubble.appendChild(react);
    }

    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;

    // Animate in
    requestAnimationFrame(() => {
      bubble.classList.add('show');
      if(msg.reaction){
        setTimeout(() => react.classList.add('show'), 300);
      }
    });

    // Sound + vibration
    playReceive();

    // Read status after a moment
    if(i === messages.length - 1){
      await wait(1200);
      const read = document.createElement('div');
      read.className = 'read-status';
      read.textContent = 'Lu à ' + new Date().getHours().toString().padStart(2,'0') + ':' + new Date().getMinutes().toString().padStart(2,'0');
      chat.appendChild(read);
      requestAnimationFrame(() => read.classList.add('show'));
      chat.scrollTop = chat.scrollHeight;
    }

    await wait(1200 + Math.random() * 400);
  }

  // Final message bubble
  await wait(800);
  const finalWrap = document.createElement('div');
  finalWrap.className = 'msg-wrap in';
  const finalBubble = document.createElement('div');
  finalBubble.className = 'msg in';
  finalBubble.innerHTML = '<div style="font-style:italic;opacity:0.8;">💌 Cette conversation a été créée avec amour...</div>';
  finalWrap.appendChild(finalBubble);
  chat.appendChild(finalWrap);
  requestAnimationFrame(() => finalBubble.classList.add('show'));
  playFinal();
  if(navigator.vibrate) navigator.vibrate([30, 20, 30, 20, 50]);

  // Back button
  await wait(1500);
  const backBtn = document.createElement('a');
  backBtn.href = 'calendrier.html';
  backBtn.className = 'back-final';
  backBtn.textContent = 'Retour au calendrier ♡';
  backBtn.style.display = 'block';
  backBtn.style.margin = '20px auto 0';
  backBtn.style.maxWidth = '200px';
  chat.appendChild(backBtn);
  chat.scrollTop = chat.scrollHeight;
}

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

/* Tap to send button visual feedback */
sendBtn.onclick = () => {
  playSend();
  sendBtn.style.transform = 'scale(0.85)';
  setTimeout(() => sendBtn.style.transform = '', 150);
};

/* Island animation on message */
function pulseIsland(){
  island.classList.add('active');
  setTimeout(() => island.classList.remove('active'), 400);
}

// Override playReceive to also pulse island
const originalPlayReceive = playReceive;
playReceive = function(){
  originalPlayReceive();
  pulseIsland();
};
</script>
</body>
</html>
