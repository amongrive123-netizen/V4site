/* ===== BRUITAGES ===== */
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function initAudio(){if(!audioCtx)audioCtx=new AudioCtx();}
function playClick(){initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.setValueAtTime(700,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(950,audioCtx.currentTime+0.05);g.gain.setValueAtTime(0.05,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.08);o.start();o.stop(audioCtx.currentTime+0.1);}
function playCorrect(){initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.setValueAtTime(523,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(784,audioCtx.currentTime+0.12);g.gain.setValueAtTime(0.06,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);o.start();o.stop(audioCtx.currentTime+0.25);}
function playWrong(){initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='triangle';o.frequency.setValueAtTime(320,audioCtx.currentTime);o.frequency.linearRampToValueAtTime(200,audioCtx.currentTime+0.18);g.gain.setValueAtTime(0.04,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.22);o.start();o.stop(audioCtx.currentTime+0.25);}
function playSpecial(){initAudio();[440,554,659,880,1109].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,audioCtx.currentTime+i*0.12);g.gain.linearRampToValueAtTime(0.07,audioCtx.currentTime+i*0.12+0.03);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+i*0.12+0.55);o.start(audioCtx.currentTime+i*0.12);o.stop(audioCtx.currentTime+i*0.12+0.65);});}
function playEnd(){initAudio();[523,659,784,1047].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,audioCtx.currentTime+i*0.1);g.gain.linearRampToValueAtTime(0.08,audioCtx.currentTime+i*0.1+0.02);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+i*0.1+0.5);o.start(audioCtx.currentTime+i*0.1);o.stop(audioCtx.currentTime+i*0.1+0.6);});}



const questions = [

{
q:"Qui est le plus jaloux ? 👀",
answers:["Moi ❤️","Toi ❤️"],
correct:0,
comment:"😭 Bon... j'avoue, c'est clairement moi."
},

{
q:'Qui dit le plus souvent "Je t\'aime" ? ❤️',
answers:["Moi ❤️","Toi ❤️"],
correct:0,
comment:"Je crois que je te le répète tout le temps. ❤️"
},

{
q:"Qui fait le plus de câlins ? 🤗",
answers:["Moi ❤️","Toi ❤️"],
correct:0,
comment:"Je pourrais te faire des câlins toute la journée."
},

{
q:"Qui est le plus têtu ? 😂",
answers:["Moi ❤️","Toi ❤️"],
correct:1,
comment:"😂 Désolé mon amour... là c'est toi."
},

{
q:"Qui est le plus gourmand ? 🍕",
answers:["Moi ❤️","Toi ❤️"],
correct:1,
comment:"🍦 Impossible de te battre là-dessus."
},

{
q:"Qui met le plus de temps à se préparer ? ⏳",
answers:["Moi ❤️","Toi ❤️"],
correct:1,
comment:"Je t'attends toujours un petit peu. 😂"
},

{
q:"Qui envoie le plus de messages ? 📱",
answers:["Moi ❤️","Les deux ❤️"],
correct:1,
comment:"❤️ On est tous les deux aussi bavards."
},

{
q:"Qui fait le plus rire l'autre ? 😂",
answers:["Moi ❤️","Toi ❤️"],
correct:0,
comment:"😎 Bon... j'abuse peut-être un peu."
},

{
q:"Qui est le plus romantique ? 🌹",
answers:["Moi ❤️","Les deux ❤️"],
correct:1,
comment:"❤️ On fait tous les deux de notre mieux."
},

{
q:"Qui s'endort le plus facilement ? 😴",
answers:["Moi ❤️","Toi ❤️"],
correct:1,
comment:"😂 Tu gagnes largement celle-là."
},

{
q:"Qui est le plus sensible ? 🥹",
answers:["Moi ❤️","Les deux ❤️"],
correct:1,
comment:"❤️ On a tous les deux un grand cœur."
},

{
q:"Qui est le plus impatient ? ⌛",
answers:["Moi ❤️","Toi ❤️"],
correct:0,
comment:"😭 Oui... surtout quand il s'agit de te revoir."
},

{
q:"Qui ferait le premier pas après une dispute ? ❤️",
answers:["Moi ❤️","Toi ❤️"],
correct:0,
comment:"Parce que je déteste rester fâché avec toi."
},

{
q:"Qui manque le plus à l'autre en ce moment ? 🥺",
answers:["Moi ❤️","Les deux ❤️"],
correct:1,
comment:"❤️ On se manque énormément tous les deux."
},

{
q:"Qui aime le plus l'autre ? ❤️",
answers:["Haroun ❤️","Inès ❤️"],
correct:-1,
special:true
}

];

let index = 0;

const question = document.getElementById("question");
const answers = document.getElementById("answers");
const feedback = document.getElementById("feedback");
const counter = document.getElementById("counter");
const bar = document.getElementById("bar");
const back = document.getElementById("back");

loadQuestion();

function loadQuestion(){

const q = questions[index];

counter.textContent=`Question ${index+1} / ${questions.length}`;

bar.style.width=((index)/questions.length)*100+"%";

question.textContent=q.q;

feedback.innerHTML="";

answers.innerHTML="";

q.answers.forEach((txt,i)=>{

const btn=document.createElement("button");

btn.className="answer";

btn.textContent=txt;

btn.onclick=()=>{playClick();if(navigator.vibrate)navigator.vibrate(6);answer(i);};

answers.appendChild(btn);

});

}

function answer(choice){

const q=questions[index];

document.querySelectorAll(".answer").forEach(b=>b.disabled=true);

if(q.special){

playSpecial();
if(navigator.vibrate)navigator.vibrate([40,30,40,30,60]);

feedback.innerHTML=`

<h2 style="color:#ff4f95;margin-bottom:15px;">
❤️
</h2>

<p>

Tu sais...

<br><br>

J'ai réfléchi longtemps à cette question.

<br><br>

Et je crois qu'il n'existe aucune bonne réponse.

<br><br>

<strong>

Parce qu'on s'aime autant l'un que l'autre. ❤️

</strong>

<br><br>

Et c'est exactement ce qui rend notre histoire si belle.

<br><br>

Je t'aime énormément, mon amour. ♡

</p>

`;

setTimeout(()=>{

finish();

},6000);

return;

}

document.querySelectorAll(".answer")[q.correct].classList.add("good");

if(choice===q.correct){playCorrect();}else{playWrong();}

feedback.innerHTML=q.comment;

setTimeout(()=>{

index++;

if(index>=questions.length){

finish();

}else{

loadQuestion();

}

},1800);

}

function finish(){

playEnd();
if(navigator.vibrate)navigator.vibrate([50,30,50,30,100]);

bar.style.width="100%";

answers.innerHTML="";

counter.textContent="Terminé ❤️";

back.style.display="block";

}

</script>
