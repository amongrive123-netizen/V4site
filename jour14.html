<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Jour 14 ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:black;

}

/* ---------- Fond ---------- */

#bg{

position:fixed;

inset:0;

background:url("assets/lady.jpg") center/cover;

filter:blur(60px);

transform:scale(1.4);

transition:1s;

}

#bg::after{

content:"";

position:absolute;

inset:0;

background:rgba(0,0,0,.42);

}

/* ---------- iPod ---------- */

.ipod{

position:relative;

width:360px;

height:680px;

border-radius:42px;

background:

linear-gradient(

180deg,

#ffffff,

#f3f3f3

);

box-shadow:

0 50px 120px rgba(0,0,0,.45),

inset 0 3px 4px rgba(255,255,255,.95),

inset 0 -10px 18px rgba(0,0,0,.08);

padding:28px;

z-index:2;

}

/* ---------- écran ---------- */

.screen{

height:265px;

border-radius:18px;

background:#111;

overflow:hidden;

position:relative;

display:flex;

justify-content:center;
align-items:center;

box-shadow:

inset 0 0 15px rgba(0,0,0,.9);

}

/* fond écran */

.screen::before{

content:"";

position:absolute;

inset:0;

background:url("assets/lady.jpg")
center/cover;

filter:blur(20px);

transform:scale(1.4);

opacity:.45;

}

/* ---------- vinyle ---------- */

.record{

position:absolute;

right:25px;

width:170px;

height:170px;

border-radius:50%;

background:

repeating-radial-gradient(

circle,

#111 0px,

#111 3px,

#222 4px,

#111 7px

);

display:flex;

justify-content:center;
align-items:center;

box-shadow:

0 15px 30px rgba(0,0,0,.45);

z-index:1;

}

.record img{

width:72px;
height:72px;

border-radius:50%;

object-fit:cover;

}

.record::after{

content:"";

position:absolute;

width:14px;
height:14px;

background:white;

border-radius:50%;

}

/* ---------- pochette ---------- */

.cover{

position:absolute;

left:25px;

width:145px;

height:145px;

background:white;

border-radius:10px;

overflow:hidden;

z-index:3;

box-shadow:

0 12px 25px rgba(0,0,0,.35);

}

.cover img{

width:100%;
height:100%;

object-fit:cover;

}

/* ---------- infos ---------- */

.info{

position:absolute;

bottom:15px;

left:18px;

right:18px;

text-align:center;

color:white;

z-index:4;

}

#title{

font-size:1.2rem;

font-weight:700;

}

#artist{

margin-top:4px;

opacity:.85;

}

.badge{

display:inline-block;

margin-top:10px;

padding:7px 16px;

border-radius:999px;

background:#ff4f95;

font-size:.8rem;

font-weight:700;

}

/* ---------- Click Wheel ---------- */

.wheel{

width:235px;

height:235px;

border-radius:50%;

margin:45px auto 0;

position:relative;

background:

radial-gradient(

circle at top,

white,

#f5f5f5 60%,

#dfdfdf

);

box-shadow:

inset 0 2px 5px white,

inset 0 -8px 15px rgba(0,0,0,.08);

}

.center{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

width:84px;
height:84px;

border-radius:50%;

background:white;

box-shadow:

0 5px 15px rgba(0,0,0,.12);

display:flex;

justify-content:center;
align-items:center;

font-size:26px;

cursor:pointer;

}

.menu{

position:absolute;

top:18px;

left:50%;

transform:translateX(-50%);

font-weight:700;

cursor:pointer;

}

.prev{

position:absolute;

left:18px;

top:50%;

transform:translateY(-50%);

font-size:28px;

cursor:pointer;

}

.next{

position:absolute;

right:18px;

top:50%;

transform:translateY(-50%);

font-size:28px;

cursor:pointer;

}

.pause{

position:absolute;

bottom:18px;

left:50%;

transform:translateX(-50%);

font-size:22px;

cursor:pointer;

}

.footer{

text-align:center;

margin-top:25px;

font-size:.82rem;

color:#666;

}

.rotating{

animation:spin 7s linear infinite;

}

@keyframes spin{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}

</style>

</head>

<body>

<div id="bg"></div>

<div class="ipod">

<div class="screen">

<div class="record"
id="record">

<img
id="recordImage"
src="assets/lady.jpg">

</div>

<div class="cover">

<img
id="cover"
src="assets/lady.jpg">

</div>

<div class="info">

<h2 id="title">

Lady

</h2>

<p id="artist">

Jul

</p>

<div
class="badge"
id="special">

❤️ Notre chanson

</div>

</div>

</div>

<div class="wheel">

<div class="menu">

MENU

</div>

<div class="prev">

⏮

</div>

<div class="next">

⏭

</div>

<div class="pause">

⏯

</div>

<div
class="center"
id="play">

▶

</div>

</div>

<div class="footer">

Chaque chanson me fait penser à toi ❤️

</div>

<audio id="audio"></audio>

</div><script>

const playlist=[

{
title:"Lady",
artist:"Jul",
cover:"assets/lady.jpg",
audio:"assets/lady.mp3",
special:true
},

{
title:"Honey Bee",
artist:"Olivia Rodrigo",
cover:"assets/musique2.jpg",
audio:"assets/musique2.mp3",
special:false
},

{
title:"Tu la love",
artist:"Jul",
cover:"assets/musique3.jpg",
audio:"assets/musique3.mp3",
special:false
},

{
title:"Heart to Heart",
artist:"Mac DeMarco",
cover:"assets/musique4.jpg",
audio:"assets/musique4.mp3",
special:false
},

{
title:"Pour elle",
artist:"SDM",
cover:"assets/musique5.jpg",
audio:"assets/musique5.mp3",
special:false
}

];

let current=0;
let playing=false;

const audio=document.getElementById("audio");

const bg=document.getElementById("bg");

const record=document.getElementById("record");

const recordImage=document.getElementById("recordImage");

const cover=document.getElementById("cover");

const title=document.getElementById("title");

const artist=document.getElementById("artist");

const badge=document.getElementById("special");

const play=document.getElementById("play");

const prev=document.querySelector(".prev");

const next=document.querySelector(".next");

const pause=document.querySelector(".pause");

loadSong();

function loadSong(){

const song=playlist[current];

audio.src=song.audio;

title.textContent=song.title;

artist.textContent=song.artist;

cover.src=song.cover;

recordImage.src=song.cover;

bg.style.backgroundImage=`url('${song.cover}')`;

document.querySelector(".screen").style.setProperty(
"background-image",
`linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url('${song.cover}')`
);

badge.style.display=song.special
?"inline-block"
:"none";

}

function startMusic(){

audio.play();

playing=true;

play.innerHTML="❚❚";

record.classList.add("rotating");

}

function stopMusic(){

audio.pause();

playing=false;

play.innerHTML="▶";

record.classList.remove("rotating");

}

play.onclick=()=>{

if(playing){

stopMusic();

}else{

startMusic();

}

};

pause.onclick=play.onclick;

next.onclick=()=>{

current++;

if(current>=playlist.length){

current=0;

}

changeSong();

};

prev.onclick=()=>{

current--;

if(current<0){

current=playlist.length-1;

}

changeSong();

};

function changeSong(){

const wasPlaying=playing;

stopMusic();

record.style.transform="translateX(30px)";
record.style.opacity=".2";

cover.parentElement.style.transform="translateX(-15px)";

setTimeout(()=>{

loadSong();

record.style.transform="translateX(0px)";
record.style.opacity="1";

cover.parentElement.style.transform="translateX(0px)";

if(wasPlaying){

startMusic();

}

},300);

}

audio.onended=()=>{

next.click();

};

record.style.transition=".35s";

cover.parentElement.style.transition=".35s";

bg.style.transition="1s";
/* ---------- Animations premium ---------- */

const style=document.createElement("style");

style.innerHTML=`

.ipod{

transition:.35s;

}

.ipod:active{

transform:scale(.995);

}

.wheel div{

user-select:none;

transition:.15s;

}

.wheel div:active{

transform:scale(.92);

}

.center:active{

transform:translate(-50%,-50%) scale(.93);

}

.record{

overflow:hidden;

}

.record::before{

content:"";

position:absolute;

inset:0;

border-radius:50%;

background:

repeating-radial-gradient(

circle,

rgba(255,255,255,.18) 0px,

rgba(255,255,255,.18) 1px,

transparent 2px,

transparent 8px

);

mix-blend-mode:overlay;

pointer-events:none;

}

.record::after{

content:"";

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

width:16px;
height:16px;

background:white;

border-radius:50%;

box-shadow:

0 0 0 5px #d8d8d8,

0 0 15px rgba(255,255,255,.5);

}

/* reflet écran */

.screen::after{

content:"";

position:absolute;

top:-50%;

left:-70%;

width:80%;

height:200%;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.18),

transparent

);

transform:rotate(25deg);

animation:shine 6s linear infinite;

pointer-events:none;

}

@keyframes shine{

0%{

left:-80%;

}

100%{

left:130%;

}

}

`;

document.head.appendChild(style);

/* vibration téléphone */

function haptic(){

if(navigator.vibrate){

navigator.vibrate(20);

}

}

play.onclick=()=>{

haptic();

if(playing){

stopMusic();

}else{

startMusic();

}

};

pause.onclick=play.onclick;

next.onclick=()=>{

haptic();

current++;

if(current>=playlist.length){

current=0;

}

changeSong();

};

prev.onclick=()=>{

haptic();

current--;

if(current<0){

current=playlist.length-1;

}

changeSong();

};

/* démarrage */

document.querySelector(".ipod").animate(

[
{opacity:0,transform:"scale(.85)"},
{opacity:1,transform:"scale(1)"}
],

{
duration:700,
easing:"ease-out",
fill:"forwards"
}

);

</script>

</body>

</html>
