<!DOCTYPE html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff4f95">

<title>Jour 7</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{

background:
radial-gradient(circle at top left,#ffd6e9,transparent 28rem),
radial-gradient(circle at bottom right,#ffc7df,transparent 24rem),
linear-gradient(135deg,#fffafd,#ffeef6);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

overflow:hidden;

}

/* ---------- ambiance en fond : coeurs qui montent doucement ---------- */

#ambient{
position:fixed;
inset:0;
z-index:-1;
overflow:hidden;
pointer-events:none;
}

.amb-heart{
position:absolute;
bottom:-40px;
color:#ff8fb8;
--op:.3;
animation:drift linear infinite;
}

@keyframes drift{
0%{ transform:translateY(0) scale(.9); opacity:0; }
12%{ opacity:var(--op); }
88%{ opacity:var(--op); }
100%{ transform:translateY(-115vh) scale(1.05); opacity:0; }
}

.card{

width:100%;
max-width:430px;

background:rgba(255,255,255,.82);

backdrop-filter:blur(12px);

border-radius:28px;

padding:28px;

text-align:center;

box-shadow:0 18px 45px rgba(0,0,0,.08);

animation:cardIn .6s cubic-bezier(.22,.8,.22,1);

}

@keyframes cardIn{
from{ opacity:0; transform:translateY(16px) scale(.97); }
to{ opacity:1; transform:translateY(0) scale(1); }
}

.badge{

display:inline-flex;
align-items:center;
gap:6px;

padding:8px 16px;

border-radius:999px;

background:#ffe5f2;

color:#ff4f95;

font-weight:700;

margin-bottom:18px;

}

.badge-icon{
width:15px;
height:15px;
}

h1{

font-size:2.4rem;

line-height:1.1;

margin-bottom:15px;

}

h1 span{

color:#ff4f95;

}

.description{

color:#777;

line-height:1.7;

margin-bottom:30px;

}

.inline-heart{
width:.85em;
height:.85em;
color:#ff4f95;
vertical-align:-.05em;
}

/* ---------- bocal ---------- */

.jar{

width:170px;
height:187px;

margin:15px auto;

animation:float 3s ease-in-out infinite alternate;

user-select:none;

}

.jar svg{

width:100%;
height:100%;
display:block;

filter:drop-shadow(0 16px 18px rgba(255,79,149,.28));

}

.jar .reflet{
animation:shimmer 3.2s ease-in-out infinite;
}

.jar .heart-decal{
transform-box:fill-box;
transform-origin:center;
animation:heartbeat 2.3s ease-in-out infinite;
}

@keyframes float{

from{

transform:translateY(0) rotate(-1.2deg);

}

to{

transform:translateY(-10px) rotate(1.2deg);

}

}

@keyframes shimmer{
0%,100%{ opacity:.3; }
50%{ opacity:.7; }
}

@keyframes heartbeat{
0%,100%{ transform:scale(1); }
50%{ transform:scale(1.1); }
}

.note{

background:#fff8fb;

border:2px dashed #ffb8d4;

border-radius:18px;

padding:22px;

min-height:140px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:8px;

text-align:center;

font-size:1.05rem;

line-height:1.8;

color:#444;

margin-bottom:25px;

transition:transform .4s cubic-bezier(.22,.8,.22,1), opacity .4s ease;

}

.note-icon{
width:26px;
height:26px;
color:#ff4f95;
flex-shrink:0;
}

.note-text{
max-width:100%;
}

button{

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:#ff4f95;

color:white;

font-size:1rem;

font-weight:700;

cursor:pointer;

display:flex;
align-items:center;
justify-content:center;
gap:8px;

transition:.25s;

}

button:active{

transform:scale(.98);

}

button:disabled{

cursor:default;

}

.btn-icon{
width:18px;
height:18px;
flex-shrink:0;
}

.progress{

width:100%;
height:8px;

background:#ffe5f2;

border-radius:999px;

overflow:hidden;

margin-top:18px;

}

.progress-fill{

height:100%;
width:0%;

background:linear-gradient(90deg,#ff8fb8,#ff4f95);

border-radius:999px;

transition:width .5s cubic-bezier(.22,.8,.22,1);

}

.counter{

margin-top:10px;

color:#999;

font-size:.9rem;

font-weight:600;

}

.return{

display:none;
align-items:center;
justify-content:center;
gap:8px;

margin-top:20px;

padding:15px;

border-radius:16px;

background:#ff4f95;

color:white;

font-weight:700;

text-decoration:none;

}

.return:hover{

background:#e6387d;

}

.return-icon{
width:16px;
height:16px;
}

/* ---------- coeurs qui jaillissent quand on pioche ---------- */

.burst-heart{
position:fixed;
color:#ff4f95;
pointer-events:none;
z-index:60;
transform:translate(-50%,-50%);
}

@media(max-width:500px){

.jar{

width:140px;
height:154px;

}

h1{

font-size:2rem;

}

}

@media (prefers-reduced-motion: reduce){

.amb-heart,
.jar,
.jar .reflet,
.jar .heart-decal,
.card{

animation:none !important;

}

}

</style>

/* ---------- petit constructeur d'icônes réutilisables ---------- */

function makeIcon(iconId, className){
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", className);
  const use = document.createElementNS(SVG_NS, "use");
  use.setAttribute("href", "#" + iconId);
  svg.appendChild(use);
  return svg;
}

/* ---------- coeurs d'ambiance qui montent en fond ---------- */

function spawnAmbientHearts(){
  const count = window.innerWidth < 480 ? 7 : 11;
  for (let i = 0; i < count; i++){
    const s = makeIcon("icon-heart", "amb-heart");
    const size = 10 + Math.random() * 15;
    s.style.left = Math.random() * 100 + "vw";
    s.style.width = size + "px";
    s.style.height = size + "px";
    s.style.setProperty("--op", (0.15 + Math.random() * 0.28).toFixed(2));
    const dur = 16 + Math.random() * 14;
    s.style.animationDuration = dur + "s";
    s.style.animationDelay = (-Math.random() * dur) + "s";
    ambient.appendChild(s);
  }
}
spawnAmbientHearts();

/* ---------- petite pluie de coeurs à un endroit précis ---------- */

function heartBurst(originEl, count){
  const rect = originEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  for (let i = 0; i < count; i++){
    const s = makeIcon("icon-heart", "burst-heart");
    const size = 10 + Math.random() * 11;
    s.style.left = cx + "px";
    s.style.top = cy + "px";
    s.style.width = size + "px";
    s.style.height = size + "px";
    document.body.appendChild(s);

    const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.5 - 0.25);
    const dist = 45 + Math.random() * 55;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 26;
    const rot = Math.random() * 70 - 35;

    const anim = s.animate([
      { transform:"translate(-50%,-50%) translate(0,0) rotate(0deg) scale(.3)", opacity:1 },
      { transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) rotate(${rot}deg) scale(1)`, opacity:0 }
    ], { duration:700 + Math.random() * 400, easing:"cubic-bezier(.2,.8,.3,1)" });

    anim.onfinish = () => s.remove();
    anim.oncancel = () => s.remove();
  }
}
